name: Promote input snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: Exact media-input tag; leave as latest to use the newest snapshot
        required: false
        default: latest
        type: string
      dry_run:
        description: Reconstruct and validate without creating experiment releases
        required: false
        default: false
        type: boolean

concurrency:
  group: media-input-promotion
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      published_count: ${{ steps.promote.outputs.published_count }}
      detector_batch: ${{ steps.detector_dispatch.outputs.batch }}
      yolox_run_id: ${{ steps.detector_dispatch.outputs.yolox_run_id }}
      nanodet_run_id: ${{ steps.detector_dispatch.outputs.nanodet_run_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show available disk
        run: df -h . /tmp

      - name: Restore and promote snapshot
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(promote --tag "${SNAPSHOT_TAG:-latest}")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          log="$RUNNER_TEMP/input-snapshot-promotion.log"
          python tools/input_snapshot.py "${args[@]}" 2>&1 | tee "$log"

          published_count="$(grep -Ec '^PUBLISHED [0-9]{4}-[0-9]{2}-[0-9]{2}:' "$log" || true)"
          echo "published_count=$published_count" >> "$GITHUB_OUTPUT"
          {
            echo '## Input snapshot promotion'
            echo "- Formal experiment Releases created: **$published_count**"
            echo "- Dry run: **$DRY_RUN**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh analytics after automated releases
        if: ${{ always() && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run analytics.yml --ref main -f selection_mode=new_only

      - name: Refresh full Release audit
        if: ${{ always() && inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run audit-experiment-releases.yml \
            --ref main \
            -f verify_archives=true \
            -f repair_notes=true

      - name: Dispatch exact YOLOX + NanoDet refresh for a changed corpus
        id: detector_dispatch
        if: ${{ success() && inputs.dry_run == false && steps.promote.outputs.published_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          batch="promotion-${GITHUB_RUN_ID}"

          dispatch_workflow() {
            local workflow="$1"
            local inputs_json="$2"
            local payload response run_id
            payload="$(jq -nc \
              --arg ref 'main' \
              --argjson inputs "$inputs_json" \
              '{ref: $ref, inputs: $inputs, return_run_details: true}')"
            response="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --input - <<<"$payload")"
            run_id="$(jq -r '.workflow_run_id // empty' <<<"$response")"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Workflow dispatch did not return a numeric workflow_run_id for $workflow" >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi
            printf '%s' "$run_id"
          }

          detector_inputs="$(jq -nc --arg batch "$batch" '{analysis_batch_id: $batch}')"
          yolox_run_id="$(dispatch_workflow detector-yolox-inference.yml "$detector_inputs")"
          nanodet_run_id="$(dispatch_workflow detector-nanodet-inference.yml "$detector_inputs")"

          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "yolox_run_id=$yolox_run_id" >> "$GITHUB_OUTPUT"
          echo "nanodet_run_id=$nanodet_run_id" >> "$GITHUB_OUTPUT"

          {
            echo '## Post-promotion detector dispatch'
            echo "- Shared batch: \`$batch\`"
            echo "- YOLOX run: \`$yolox_run_id\`"
            echo "- NanoDet run: \`$nanodet_run_id\`"
            echo '- Exact run IDs came directly from the workflow-dispatch API response.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_detector_comparison:
    needs: promote
    if: ${{ needs.promote.result == 'success' && inputs.dry_run == false && needs.promote.outputs.published_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    outputs:
      publisher_run_id: ${{ steps.publisher_dispatch.outputs.publisher_run_id }}
    steps:
      - name: Wait for exact detector pair
        env:
          GH_TOKEN: ${{ github.token }}
          YOLOX_RUN_ID: ${{ needs.promote.outputs.yolox_run_id }}
          NANODET_RUN_ID: ${{ needs.promote.outputs.nanodet_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$YOLOX_RUN_ID" "$NANODET_RUN_ID"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Missing exact detector run ID from promotion: $value" >&2
              exit 1
            fi
          done
          echo "Waiting for YOLOX run $YOLOX_RUN_ID"
          gh run watch "$YOLOX_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "Waiting for NanoDet run $NANODET_RUN_ID"
          gh run watch "$NANODET_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch comparison publisher with exact run IDs
        id: publisher_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          YOLOX_RUN_ID: ${{ needs.promote.outputs.yolox_run_id }}
          NANODET_RUN_ID: ${{ needs.promote.outputs.nanodet_run_id }}
          DETECTOR_BATCH: ${{ needs.promote.outputs.detector_batch }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg ref 'main' \
            --arg yolox "$YOLOX_RUN_ID" \
            --arg nanodet "$NANODET_RUN_ID" \
            '{
              ref: $ref,
              inputs: {
                yolox_run_id: $yolox,
                nanodet_run_id: $nanodet,
                publish_release: true
              },
              return_run_details: true
            }')"
          response="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/detector-comparison-publish.yml/dispatches" \
            --input - <<<"$payload")"
          publisher_run_id="$(jq -r '.workflow_run_id // empty' <<<"$response")"
          if [[ ! "$publisher_run_id" =~ ^[0-9]+$ ]]; then
            echo 'Comparison publisher dispatch did not return a numeric workflow_run_id' >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "publisher_run_id=$publisher_run_id" >> "$GITHUB_OUTPUT"
          {
            echo '## Detector comparison handoff'
            echo "- Shared batch: \`$DETECTOR_BATCH\`"
            echo "- YOLOX run: \`$YOLOX_RUN_ID\`"
            echo "- NanoDet run: \`$NANODET_RUN_ID\`"
            echo "- Comparison publisher run: \`$publisher_run_id\`"
            echo '- Both inference runs completed successfully before this exact-pair publisher dispatch.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify_detector_publication:
    needs: publish_detector_comparison
    if: ${{ needs.publish_detector_comparison.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for comparison publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_RUN_ID: ${{ needs.publish_detector_comparison.outputs.publisher_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISHER_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Missing exact publisher run ID: $PUBLISHER_RUN_ID" >&2
            exit 1
          fi
          echo "Waiting for comparison publisher run $PUBLISHER_RUN_ID"
          gh run watch "$PUBLISHER_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "Comparison publisher run $PUBLISHER_RUN_ID completed successfully" >> "$GITHUB_STEP_SUMMARY"
